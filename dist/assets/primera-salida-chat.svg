<svg xmlns="http://www.w3.org/2000/svg" width="540" height="624" viewBox="0 0 540 624" role="img" aria-label="Captura de ejemplo de la conversación">
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#5b4a33" flood-opacity=".18"/></filter>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.3" fill="#d8ccb6"/><circle cx="17" cy="15" r="1" fill="#e2d7c3"/></pattern>
<style>.msg{font:17px "Segoe UI",Arial,sans-serif;fill:#2c2a26}.time{font:11px "Segoe UI",Arial,sans-serif;fill:#8a8478}.name{font:600 19px "Segoe UI",Arial,sans-serif;fill:#fff}.status{font:13px "Segoe UI",Arial,sans-serif;fill:#d9e8e0}.chip{font:12px "Segoe UI",Arial,sans-serif;fill:#6e665a;letter-spacing:.4px}.note{font:italic 12px Georgia,serif;fill:#9a8a6c}</style></defs>
<rect width="540" height="624" rx="28" fill="#efe7da"/><rect width="540" height="624" rx="28" fill="url(#dots)"/>
<path d="M0 28a28 28 0 0 1 28-28h484a28 28 0 0 1 28 28v56H0Z" fill="#3e5b50"/>
<text x="26" y="54" class="name" fill="#fff">‹</text>
<circle cx="74" cy="48" r="21" fill="#c9a564"/><text x="74" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#fff">S</text>
<text x="106" y="44" class="name">Sofía</text><text x="106" y="65" class="status">en línea</text>
<rect x="178" y="104" width="184" height="26" rx="13" fill="#fbf6ea" filter="url(#lift)"/><text x="270" y="122" text-anchor="middle" class="chip">20 DE ENERO DE 2026</text>
<g><rect x="144.40000000000003" y="150" width="373.59999999999997" height="82" rx="14" fill="#dcf3cf" filter="url(#lift)"/><text x="160.40000000000003" y="178" class="msg">Hola, Sofía. Me quedé pensando en</text><text x="160.40000000000003" y="202" class="msg">nuestra conversación de ayer.</text><text x="504" y="222" class="time" text-anchor="end">19:42  ✓✓</text></g><g><rect x="22" y="246" width="336.79999999999995" height="82" rx="14" fill="#fffdf8" filter="url(#lift)"/><text x="38" y="274" class="msg">Hola, Daniel. Yo también. Qué</text><text x="38" y="298" class="msg">bonito leerte.</text><text x="344.79999999999995" y="318" class="time" text-anchor="end">19:45</text></g><g><rect x="153.60000000000002" y="342" width="364.4" height="82" rx="14" fill="#dcf3cf" filter="url(#lift)"/><text x="169.60000000000002" y="370" class="msg">¿Seguimos la conversación con un</text><text x="169.60000000000002" y="394" class="msg">café algún día?</text><text x="504" y="414" class="time" text-anchor="end">19:47  ✓✓</text></g><g><rect x="22" y="438" width="355.2" height="82" rx="14" fill="#fffdf8" filter="url(#lift)"/><text x="38" y="466" class="msg">Me encantaría. Creo que tenemos</text><text x="38" y="490" class="msg">mucho que contarnos.</text><text x="363.2" y="510" class="time" text-anchor="end">19:49</text></g>
<rect x="22" y="550" width="436" height="44" rx="22" fill="#fffdf8"/><text x="42" y="578" class="time" font-size="15">Escribe un mensaje</text>
<circle cx="496" cy="572" r="22" fill="#3e5b50"/><path d="M488 564l18 8-18 8 3-8Z" fill="#fff"/>
<text x="270" y="614" text-anchor="middle" class="note">Captura de ejemplo · reemplázala por la real</text>
</svg>